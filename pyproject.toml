[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webcam-user-interface"
version = "0.1.0"
description = "Independent E-SOH webcam observation listener and read-only visualization API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4", "paho-mqtt>=2.1,<3",
  "httpx>=0.27,<1", "argon2-cffi>=23,<26", "itsdangerous>=2.2,<3",
  "prometheus-client>=0.20,<1", "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "pgserver==0.1.4"]

[project.scripts]
webcam-ui = "webcam_ui.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
webcam_ui = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an isolated PostgreSQL server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
